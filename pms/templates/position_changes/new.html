{% extends "base.html" %}
{% block content %}
<h2>New Position Change</h2>
<article>
<form method="post">
  <label>Employee
    <select name="employee_id" required>
      <option value="">— select —</option>
      {% for e in employees %}
        <option value="{{ e.id }}" {% if form.employee_id|string == e.id|string %}selected{% endif %}>{{ e.full_name }} — {{ e.position.title if e.position }}</option>
      {% endfor %}
    </select>
  </label>
  <label>New Position
    <select name="new_position_id" required>
      <option value="">— select —</option>
      {% for p in positions %}
        <option value="{{ p.id }}" {% if form.new_position_id|string == p.id|string %}selected{% endif %}>{{ p.title }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Reason
    <textarea name="reason" required>{{ form.reason }}</textarea>
  </label>
  <div class="actions">
    <button type="submit">Apply</button>
    <a href="{{ url_for('main.dashboard') }}" role="button" class="secondary">Cancel</a>
  </div>
</form>
</article>
{% endblock %}
