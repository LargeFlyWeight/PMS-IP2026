{% extends "base.html" %}
{% block content %}
<hgroup>
  <h2>Reset Password</h2>
  <p>Setting a new password for <strong>{{ emp.full_name }}</strong> ({{ emp.username }})</p>
</hgroup>

<article style="max-width: 480px;">
  <form method="post">
    <label>New password
      <input type="password" name="password" required minlength="6" autofocus>
    </label>
    <label>Confirm new password
      <input type="password" name="confirm" required minlength="6">
    </label>
    <div class="actions">
      <button type="submit">Set password</button>
      <a href="{{ url_for('employees.detail', employee_id=emp.id) }}"
         role="button" class="secondary">Cancel</a>
    </div>
  </form>
</article>
{% endblock %}
