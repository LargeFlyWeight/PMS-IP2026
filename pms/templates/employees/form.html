{% extends "base.html" %}
{% block content %}
<h2>{{ "Edit" if emp else "New" }} Employee</h2>
<article>
<form method="post">
  {% if not emp %}
  <div class="grid">
    <label>Username
      <input type="text" name="username" required>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
  </div>
  {% endif %}

  <div class="grid">
    <label>Name
      <input type="text" name="name" value="{{ emp.name if emp }}" required>
    </label>
    <label>Surname
      <input type="text" name="surname" value="{{ emp.surname if emp }}" required>
    </label>
  </div>

  <div class="grid">
    <label>Email
      <input type="email" name="email" value="{{ emp.email if emp }}" required>
    </label>
    <label>Phone
      <input type="text" name="phone" value="{{ emp.phone_number if emp }}">
    </label>
  </div>

  <label>Date of birth
    <input type="date" name="dob" value="{{ emp.date_of_birth if emp }}">
  </label>

  <div class="grid">
    <label>Department
      <select name="department_id" required>
        {% for d in departments %}
          <option value="{{ d.id }}" {% if emp and emp.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Position
      <select name="position_id" required>
        {% for p in positions %}
          <option value="{{ p.id }}" {% if emp and emp.position_id == p.id %}selected{% endif %}>{{ p.title }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Role
      <select name="role">
        <option value="employee" {% if emp and emp.role == 'employee' %}selected{% endif %}>employee</option>
        <option value="manager" {% if emp and emp.role == 'manager' %}selected{% endif %}>manager</option>
        <option value="administrator" {% if emp and emp.role == 'administrator' %}selected{% endif %}>administrator</option>
      </select>
    </label>
  </div>

  <div class="actions">
    <button type="submit">Save</button>
    <a href="{{ url_for('employees.list_employees') }}" role="button" class="secondary">Cancel</a>
  </div>
</form>
</article>
{% endblock %}
