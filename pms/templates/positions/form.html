{% extends "base.html" %}
{% block content %}
<h2>{{ "Edit" if pos else "New" }} Position</h2>
<article>
<form method="post">
  <label>Title
    <input type="text" name="title" value="{{ form.title }}" required>
  </label>
  <label>Salary grade
    <input type="text" name="salary_grade" value="{{ form.salary_grade }}" required>
  </label>
  <label>Description
    <textarea name="description">{{ form.description }}</textarea>
  </label>
  <div class="actions">
    <button type="submit">Save</button>
    <a href="{{ url_for('main.dashboard') }}" role="button" class="secondary">Cancel</a>
  </div>
</form>
</article>
{% endblock %}
