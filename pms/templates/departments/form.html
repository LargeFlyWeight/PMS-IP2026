{% extends "base.html" %}
{% block content %}
<h2>{{ "Edit" if dept else "New" }} Department</h2>
<article>
<form method="post">
  {% if not dept %}
  <label>Code
    <input type="text" name="code" value="{{ form.code }}" required>
  </label>
  {% endif %}
  <label>Name
    <input type="text" name="name" value="{{ form.name }}" required>
  </label>
  <label>Location (room)
    <input type="text" name="location" value="{{ form.location }}">
  </label>
  <div class="actions">
    <button type="submit">Save</button>
    <a href="{{ url_for('main.dashboard') }}" role="button" class="secondary">Cancel</a>
  </div>
</form>
</article>
{% endblock %}
