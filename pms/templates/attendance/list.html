{% extends "base.html" %}
{% block content %}
<h2>My Attendance</h2>
<a href="{{ url_for('attendance.record') }}" role="button">+ Record Today</a>
<table>
  <thead>
    <tr><th>Date</th><th>Start</th><th>Lunch (min)</th><th>Finish</th><th>Worked</th></tr>
  </thead>
  <tbody>
  {% for r in records %}
  <tr>
    <td>{{ r.date }}</td>
    <td>{{ r.start_time }}</td>
    <td>{{ r.lunch_break }}</td>
    <td>{{ r.finish_time }}</td>
    <td><strong>{{ r.working_time_display() }}</strong></td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
