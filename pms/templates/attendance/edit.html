{% extends "base.html" %}
{% block content %}
<h2>Edit Attendance — {{ record.employee.full_name }} / {{ record.date }}</h2>
<article>
<form method="post">
  <div class="grid">
    <label>Start time
      <input type="time" name="start_time" value="{{ form.start_time }}" required>
    </label>
    <label>Lunch break (min)
      <input type="number" name="lunch_break" min="0" max="60" value="{{ form.lunch_break }}" required>
    </label>
    <label>Finish time
      <input type="time" name="finish_time" value="{{ form.finish_time }}" required>
    </label>
  </div>
  <div class="actions">
    <button type="submit">Save</button>
    <a href="{{ url_for('main.dashboard') }}" role="button" class="secondary">Cancel</a>
  </div>
</form>
</article>
{% endblock %}
