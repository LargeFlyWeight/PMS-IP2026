{% extends "base.html" %}
{% block content %}
<h2>Record Attendance</h2>
<article>
<form method="post">
  <label>Date
    <input type="date" name="date" value="{{ today }}" required>
  </label>
  <div class="grid">
    <label>Start time
      <input type="time" name="start_time" required>
    </label>
    <label>Lunch break (0–60 min)
      <input type="number" name="lunch_break" min="0" max="60" value="0" required>
    </label>
    <label>Finish time
      <input type="time" name="finish_time" required>
    </label>
  </div>
  <div class="actions">
    <button type="submit">Save</button>
    <a href="{{ url_for('attendance.my_attendance') }}" role="button" class="secondary">Cancel</a>
  </div>
</form>
</article>
{% endblock %}
